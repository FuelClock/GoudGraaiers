name: Deploy guild site

# Single-branch deploy: builds main and publishes it at the site root.
# (The old redesign branch and its /redesign/ preview were removed once the
# redesign was fully merged and verified on main.)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (production)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Build production site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./main
          destination: ./site

      - name: Assemble artifact
        run: |
          # jekyll-build-pages outputs root-owned dirs, so use sudo to read-copy
          mkdir -p ./assembled
          sudo cp -a ./site/. ./assembled/
          sudo chown -R "$(id -u):$(id -g)" ./assembled
          echo "Assembled: $(find ./assembled -maxdepth 1 -type f | wc -l) root files"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./assembled

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
