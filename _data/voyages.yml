    **SHIP HUNT AT AL-KHALIF**
    
    11/11/2026 at 20:00
    
    **What will we be doing?**
    
    Be sure to gather at Al-Khalif port before 20:00 as this is the time we will leave the port together.
    
    We'll sail to the northeast of the port and we'll be blockading the 2 trade routes, but this time there is no boarding: we shoot and sink every ship that sails those routes.
    
    Depending on how many people show up we can split into squads and cover both trade routes at once.
    
    Bring your best gunship, plenty of ammo and repairs, and we'll sink as many ships as we can. The goal is efficiency and fun!
