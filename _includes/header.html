<header class="site-header">
  <a class="brand" href="{{ '/' | relative_url }}">
    <img class="brand-logo" src="{{ '/img/logo.jpg' | relative_url }}" alt="" width="200" height="132">
    <span class="brand-name">Goud Graaiers</span>
  </a>
  <nav class="header-nav" aria-label="Site">
    {% for item in site.nav %}
    <a href="{{ item.url | relative_url }}">{{ item.label }}</a>
    {% endfor %}
  </nav>
  <a class="header-action" href="ts3server://{{ site.teamspeak }}">TeamSpeak <span class="ts-domain">&ensp;·&ensp;{{ site.teamspeak }}</span></a>
</header>
