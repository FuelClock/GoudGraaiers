<section class="voyages" aria-label="Voyages">
  <h2 class="voyages-heading">Recent voyages</h2>
  <div class="deck">
    {% for v in site.data.voyages %}
    <article class="deck-card tone-{{ forloop.index }}" data-index="{{ forloop.index0 }}">
      <h3 class="card-title">{{ v.title }}</h3>
      <p class="card-excerpt">{{ v.excerpt }}</p>
      <div class="card-foot">
        <span class="card-date">{{ v.date_label }}</span>
        <a class="card-link" href="{{ v.url | relative_url }}">Read the plan</a>
      </div>
    </article>
    {% endfor %}
  </div>
  <p class="deck-more">The voyage log is kept from TeamSpeak. <a href="{{ '/events.html' | relative_url }}">See all voyages</a></p>
</section>

<section class="gallery" aria-label="The fleet at sea">
  <figure class="gallery-figure">
    <img src="{{ '/img/paintings/bakhuizen-ships-in-a-storm.jpg' | relative_url }}" alt="Ships battling mountainous waves under a dark storm sky, oil painting by Ludolf Bakhuizen" width="1920" height="1577" loading="lazy" decoding="async">
    <figcaption>Ships in a Storm, Ludolf Bakhuizen</figcaption>
  </figure>
  <figure class="gallery-figure">
    <img src="{{ '/img/paintings/bakhuizen-storm-norwegian-coast.jpg' | relative_url }}" alt="Ships fleeing a storm along a Norwegian coast under a Dutch flag, oil painting by Ludolf Bakhuizen" width="1401" height="690" loading="lazy" decoding="async">
    <figcaption>Ships in a Storm off the Norwegian Coast, Ludolf Bakhuizen, 1694</figcaption>
  </figure>
</section>
