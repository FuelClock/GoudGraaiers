<div class="masthead-hero masthead-hero--slim">
  <img src="{{ '/img/paintings/bakhuizen-storm-norwegian-coast.jpg' | relative_url }}" alt="Ships fleeing a storm along a Norwegian coast under a Dutch flag, oil painting by Ludolf Bakhuizen" width="1401" height="690" loading="lazy" decoding="async">
</div>
<div class="page-title-band">
  <h1 class="page-title">{{ page.title }}</h1>
  <div class="page-side">
    {% if page.lead %}<p class="page-lead">{{ page.lead }}</p>{% endif %}
    {% if page.ts_action %}<a class="page-action" href="ts3server://{{ site.teamspeak }}">Connect to TeamSpeak</a>{% endif %}
  </div>
</div>
